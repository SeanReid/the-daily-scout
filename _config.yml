title: The Daily Scout
description: "Curated product roundups — tested, reviewed, and ranked so you don't have to."
url: "https://seanreid.github.io"
baseurl: "/the-daily-scout"
permalink: /:slug/
future: true

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO
twitter:
  card: summary
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "The Daily Scout Editorial Team"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
